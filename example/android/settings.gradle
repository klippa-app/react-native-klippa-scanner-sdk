pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }

def keystoreProperties = new Properties()
def keystorePropertiesFile = new File(rootDir, 'key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

dependencyResolutionManagement {
    repositories {
        maven {
            credentials {
                username System.getenv('KLIPPA_SCANNER_SDK_USERNAME') ?: keystoreProperties['klippa.scanner.sdk.username'] ?: ''
                password System.getenv('KLIPPA_SCANNER_SDK_PASSWORD') ?: keystoreProperties['klippa.scanner.sdk.password'] ?: ''
            }
            url System.getenv('KLIPPA_SCANNER_SDK_URL') ?: keystoreProperties['klippa.scanner.sdk.url'] ?: 'https://custom-ocr.klippa.com/sdk/android/maven'
        }
    }
}

rootProject.name = 'KlippaScannerSdkExample'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
